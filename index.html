		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>
			// Load slide fragments before initializing Reveal
			const loadExternalSlides = () => {
				const sections = Array.from(document.querySelectorAll('[data-external]'));
				if (!sections.length) return Promise.resolve();
				return Promise.all(sections.map(async (section) => {
					const src = section.getAttribute('data-external');
					const response = await fetch(src);
					if (!response.ok) throw new Error(`Failed to load ${src}`);
					section.innerHTML = await response.text();
				}));
			};

			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			loadExternalSlides()
				.catch((error) => console.error(error))
				.finally(() => {
					Reveal.initialize({
						progress: false,
						controls: false,
						hash: true,

						// Learn about plugins: https://revealjs.com/plugins/
						plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
					});
				});
		</script>
	</body>
